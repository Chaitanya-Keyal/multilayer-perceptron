[project]
name = "multilayer-perceptron"
version = "0.1.0"
description = "BITS F464 Assignment 2 - a two-layer perceptron from scratch, and depth, width and activation with scikit-learn's MLPClassifier"
requires-python = ">=3.12"

# Part 1 imports numpy and matplotlib only; Part 2 adds scikit-learn.
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
]

[dependency-groups]
# Tests, lint and formatting; uv installs this group by default.
dev = ["pytest>=8", "ruff>=0.17"]
# The demo notebook (notebooks/demo.ipynb), which only calls the part scripts.
notebook = ["jupyterlab>=4"]

[tool.uv]
# The repo is run in place, not installed as a package.
package = false

[tool.ruff]
line-length = 100
# common.py is the handout's code, copied as printed, so it is neither reformatted nor linted.
extend-exclude = ["common.py"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, modern syntax, likely bugs, simplifications,
# comprehensions, naming, ruff's own rules.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "PTH", "N", "RUF"]
# X, W1, Z1, H and friends follow the handout's notation.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# The scripts pick the Agg backend before pyplot is imported.
"part*.py" = ["E402"]
# The notebook puts the repo root on sys.path before it can import the parts.
"notebooks/*" = ["E402"]

[tool.pytest.ini_options]
# The part scripts and common.py sit at the repo root and are imported from there.
pythonpath = ["."]
testpaths = ["tests"]
